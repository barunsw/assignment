server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:contact;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 1MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.barun.contact.domain
  configuration:
    map-underscore-to-camel-case: true
